<VirtualHost *:80>
    ServerName mediawiki.dev
    ServerAlias www.mediawiki.dev

    DocumentRoot /var/www/mjfrog

    <Directory /var/www/mjfrog>
        # Allow .htaccess rewrite rules
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
